<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hunger in the neck</title>
    <meta name="description" content="A mobile-friendly feed of everyday recipes with ingredients, cooking times, and instructions." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Hunger in the neck" />
    <meta property="og:description" content="A feed of everyday recipes with ingredients, cooking times, and instructions." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Everyday Table" />
    <meta name="twitter:description" content="A feed of everyday recipes with ingredients, cooking times, and instructions." />
    <meta name="theme-color" content="#f5f1e7" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="site-shell">
      <header class="masthead">
        <div class="page-width masthead-inner">
          <a class="brand" href="#top" aria-label="Hunger in the neck">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 9h14l-1.2 10H6.2L5 9Z" />
                <path d="M4 7h16v2H4zM8 5c0-1.5 2-1.5 2-3M14 5c0-1.5 2-1.5 2-3" />
              </svg>
            </span>
            <span class="brand-name">Hunger in the neck</span>
          </a>
          <nav class="nav-links" aria-label="Recipe controls">
            <button type="button" class="nav-link feed-control" id="button-random-recipe">
              <svg aria-hidden="true" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="m14 3 3 3-3 3M3 6h2.5c3.5 0 5 8 8.5 8H17M14 14l3 3-3 3M3 14h2.5c1.4 0 2.5-1.5 3.5-3" />
              </svg>
              Random recipe
            </button>
            <button type="button" class="nav-link feed-control" id="button-reset-feed">
              <svg aria-hidden="true" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 6V2m0 4h4M4.6 5.4A7 7 0 1 1 3 11" />
              </svg>
              Reset
            </button>
          </nav>
        </div>
      </header>

      <main id="top">
        <section class="page-width browse" id="browse" aria-labelledby="browse-heading">
          <div class="section-head">
            <h1 id="browse-heading">Recipes</h1>
            <span class="recipe-count" id="recipe-count" aria-live="polite">Loading recipes</span>
          </div>
          <div class="recipe-grid" id="recipe-feed" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <button type="button" class="scroll-top-button" id="button-scroll-to-top" aria-label="Scroll to top" title="Back to top">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5m-7 7 7-7 7 7" />
      </svg>
    </button>

    <div class="modal-backdrop" id="recipe-modal" hidden>
      <section class="recipe-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-recipe-title" tabindex="-1">
        <div class="dialog-top">
          <button type="button" class="dialog-back" id="button-close-recipe">
            <svg aria-hidden="true" viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 4-6 6 6 6M6 10h11" />
            </svg>
            Back to recipes
          </button>
          <button type="button" class="icon-action" id="button-dismiss-recipe" aria-label="Close recipe">
            <svg aria-hidden="true" viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="m5 5 10 10M15 5 5 15" />
            </svg>
          </button>
        </div>
        <div id="recipe-detail-content"></div>
      </section>
    </div>
  </body>
</html>
